name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version) { throw 'Version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
      - run: npm test
      - name: Test Statistics Analysis Tool
        run: dotnet test third_party/statistics-analysis/src/StatisticsAnalysisTool.UnitTests/StatisticsAnalysisTool.UnitTests.csproj -c Release -p:LocalInstallerBuild=true --results-directory work/sat-test-results
      - name: Build installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare draft release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            $releaseFlags = @()
            if ($version.Contains('-')) { $releaseFlags += '--prerelease' }
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Albion Lab $version" --draft --notes-file "docs/releases/$version.md" @releaseFlags
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Refusing to overwrite a published release' }
          gh release upload $tag release/*.exe release/*.blockmap release/latest.yml --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release files' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
